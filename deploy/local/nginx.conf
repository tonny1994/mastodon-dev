map $http_upgrade $mastodon_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name mastodon.test.com;
    return 301 https://mastodon.test.com$request_uri;
}

server {
    listen 443 ssl;
    server_name mastodon.test.com;
    ssl_certificate /etc/nginx/mastodon-tls/certificate.pem;
    ssl_certificate_key /etc/nginx/mastodon-tls/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 99m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $mastodon_backend mastodon-app:3000;
    set $mastodon_streaming mastodon-stream:4000;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Proxy "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $mastodon_connection_upgrade;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location /api/v1/streaming {
        proxy_pass http://$mastodon_streaming;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://$mastodon_backend;
    }
}
